<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" font-family="Inter, 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="gauge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="bIndigo"><stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="bCyan"><stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/></radialGradient>
    <radialGradient id="bPurple"><stop offset="0" stop-color="#c084fc" stop-opacity="0.4"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <circle cx="110" cy="50" r="200" fill="url(#bIndigo)"/>
  <circle cx="1110" cy="320" r="220" fill="url(#bPurple)"/>
  <circle cx="640" cy="0" r="150" fill="url(#bCyan)"/>

  <text x="88" y="152" font-size="30" font-weight="700" fill="#e8ecf5" letter-spacing="-0.5">Student Mental Health Score Predictor</text>
  <text x="88" y="192" font-size="14" font-weight="600" fill="#6b7693" letter-spacing="2">RANDOM FOREST &#183; FASTAPI &#183; SCIKIT-LEARN</text>

  <g transform="translate(980,160)">
    <circle r="80" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="13"/>
    <circle r="80" fill="none" stroke="url(#gauge)" stroke-width="13" stroke-linecap="round"
            stroke-dasharray="502.65" stroke-dashoffset="141" transform="rotate(-90)"/>
    <text x="0" y="-4" text-anchor="middle" dominant-baseline="central" font-size="46" font-weight="800" fill="#ffffff">7.2</text>
    <text x="0" y="30" text-anchor="middle" font-size="15" font-weight="600" fill="#6b7693">/ 10</text>
  </g>
</svg>
